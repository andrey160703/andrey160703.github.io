<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrey Guseff — Developer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="center">
    <div class="content">
      <h1>Andrey Guseff</h1>
      <p class="subtitle">Разработчик, который говорит на разных языках — от Python до JavaScript.</p>
      <p class="text">
        Работаю в индустрии, создаю решения, которые действительно работают.  
        Сейчас учусь в Вышке и осваиваю машинное обучение — пытаюсь научить машину понимать мир.
      </p>
      <button id="toggleBtn" class="btn">📄 Развернуть резюме</button>
      <div id="resumeContainer" class="resume hidden">
        <object data="resume.pdf" type="application/pdf" width="100%" height="600px">
          <p>Ваш браузер не поддерживает PDF. <a href="resume.pdf">Скачать файл</a>.</p>
        </object>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Andrey Guseff</p>
  </footer>

  <script>
    const btn = document.getElementById('toggleBtn');
    const resume = document.getElementById('resumeContainer');
    let open = false;
    btn.addEventListener('click', () => {
      open = !open;
      resume.classList.toggle('hidden', !open);
      btn.textContent = open ? '🔽 Скрыть резюме' : '📄 Развернуть резюме';
    });
  </script>
</body>
</html>
